services:
  # =========================================================================
  # 1. Cơ sở dữ liệu MySQL 8.0
  # =========================================================================
  mysql:
    image: mysql:8.0
    container_name: dongho-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password_2026
      MYSQL_DATABASE: dongho_shop
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot_password_2026 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dongho-network

  # =========================================================================
  # 2. Máy chủ RESTful API Gateway (Node.js & Express)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dongho-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: dongho_shop
      DB_USER: root
      DB_PASSWORD: root_password_2026
      DB_DIALECT: mysql
      JWT_SECRET: super_luxury_watch_secret_key_2026
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_SECRET: super_luxury_watch_refresh_secret_key_2026
      JWT_REFRESH_EXPIRES_IN: 7d
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dongho-network

  # =========================================================================
  # 3. Phân hệ Client Boutique (Next.js 16 Storefront)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    container_name: dongho-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - backend
    networks:
      - dongho-network

  # =========================================================================
  # 4. Phân hệ Quản Trị & ERP (Next.js 16 Admin Portal)
  # =========================================================================
  fe-admin:
    build:
      context: ./fe-admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    container_name: dongho-fe-admin
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
    depends_on:
      - backend
    networks:
      - dongho-network

# =========================================================================
# Volumes & Networks
# =========================================================================
volumes:
  mysql_data:
    driver: local

networks:
  dongho-network:
    driver: bridge
